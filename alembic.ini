# Alembic configuration for PostgreSQL schema migrations.

[alembic]

# Migration environment location.
script_location = %(here)s/alembic

# Make the src-layout application package importable from alembic/env.py.
prepend_sys_path = %(here)s/src

# Use OS-specific path splitting.
path_separator = os

# Migration revision files are stored here.
version_locations = %(here)s/alembic/versions

# Write generated migration files as UTF-8.
output_encoding = utf-8

# The real database URL is intentionally not stored here.
# alembic/env.py loads DATABASE_URL through application Settings.
sqlalchemy.url =


[post_write_hooks]

# Format generated migrations first, then lint/fix them.
hooks = ruff_format, ruff_check

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S